name: Quality checks

on:
  push:
    branches: [main, researchmind-v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q researchmind tests
      - name: Run tests
        run: pytest
      - name: Run offline diagnostic
        run: researchmind --diagnose
